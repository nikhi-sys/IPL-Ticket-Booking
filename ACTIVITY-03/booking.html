
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>
</head>
<body>

    <h1>IPL Ticket Booking Form</h1>

    <form>

        <h2>Personal Details</h2>

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name"
               required minlength="3" maxlength="30">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone"
               required minlength="10" maxlength="10"
               pattern="[0-9]{10}">
        <br><br>

        <h2>Match Details</h2>

        <label for="match">Select Match:</label>
        <select id="match" name="match" required>
            <option value="">--Select Match--</option>
            <option value="CSK vs MI">CSK vs MI</option>
            <option value="RCB vs KKR">RCB vs KKR</option>
            <option value="MI vs RCB">MI vs RCB</option>
            <option value="CSK vs SRH">CSK vs SRH</option>
        </select>
        <br><br>

        <label for="stand">Stand Category:</label>
        <select id="stand" name="stand" required>
            <option value="">--Select Stand--</option>
            <option value="General">General</option>
            <option value="Premium">Premium</option>
            <option value="VIP">VIP</option>
        </select>
        <br><br>

        <label for="tickets">Number of Tickets:</label>
        <input type="number" id="tickets" name="tickets"
               min="1" max="10" required>
        <br><br>

        <h2>Additional Preferences</h2>

        <label>
            <input type="radio" name="preference" value="Veg" required>
            Vegetarian Food
        </label>
        <br>

        <label>
            <input type="radio" name="preference" value="Non-Veg">
            Non-Vegetarian Food
        </label>
        <br><br>

        <button type="submit">Submit Booking</button>
        <button type="reset">Reset Form</button>

    </form>

</body>
</html>
